# Render Blueprint: Geiger Docs signing service (unmodified Documenso v2.21.1 + boot script) and its own Render Postgres.
# Create it with New > Blueprint and Blueprint Path deploy/documenso/render/render.yaml. Runbook: ./README.md
services:
  - type: web
    name: geiger-documenso
    runtime: docker
    # 1 CPU / 2 GB, $25/mo: Documenso's documented minimum is 1 GB RAM, so the 512 MB plans (free, 0.5c-512mb) are below it
    plan: 1c-2g
    # Close to Vercel's default function region (iad1); keep it equal to the database's, it can't change after creation
    region: virginia
    # Paths are relative to the repo root (no rootDir); the Dockerfile COPYs repo-relative paths, so the context is the root
    dockerfilePath: ./deploy/documenso/render/Dockerfile
    dockerContext: .
    buildFilter:
      paths:
        - deploy/documenso/render/**
    # Returns 200 while the app and database are up (also with a certificate warning), 500 when the database is down
    healthCheckPath: /api/health
    envVars:
      # Render wiring; entrypoint.sh maps these to Documenso's variables
      - key: DATABASE_URL
        fromDatabase:
          name: geiger-documenso-db
          property: connectionString
      - key: PORT
        value: "10000"
      # About 75% of the plan's RAM for the V8 heap; lower it (e.g. 384) if you move to a 512 MB plan
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536

      # Generated once by Render and kept across deploys; never change the encryption keys after first boot
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PRIVATE_ENCRYPTION_KEY
        generateValue: true
      - key: NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY
        generateValue: true
      - key: NEXT_PRIVATE_SIGNING_PASSPHRASE
        generateValue: true
      # Shared secret for Documenso's team webhook and Geiger Docs (logged in the setup banner)
      - key: DOCUMENSO_WEBHOOK_SECRET
        generateValue: true

      # Prompted once when the Blueprint is created; leave the certificate empty on first deploy
      - key: NEXT_PRIVATE_RESEND_API_KEY
        sync: false
      - key: NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS
        sync: false
      - key: DOCUMENSO_ADMIN_EMAIL
        sync: false
      - key: GEIGER_DOCS_WEBHOOK_URL
        sync: false

      # Fixed configuration
      - key: NEXT_PRIVATE_SIGNING_TRANSPORT
        value: local
      - key: NEXT_PRIVATE_SMTP_TRANSPORT
        value: resend
      - key: NEXT_PRIVATE_SMTP_FROM_NAME
        value: Geiger Docs
      - key: NEXT_PRIVATE_SMTP_FROM_ADDRESS
        value: signing@geiger.studio
      - key: NEXT_PUBLIC_UPLOAD_TRANSPORT
        value: database
      - key: DOCUMENSO_DISABLE_TELEMETRY
        value: "true"
      # Signup closed; set DOCUMENSO_ALLOW_SIGNUP=true in the dashboard once to create the first account
      - key: NEXT_PUBLIC_DISABLE_SIGNUP
        value: "true"
      - key: DOCUMENSO_ALLOW_SIGNUP
        value: "false"

databases:
  - name: geiger-documenso-db
    # $6/mo + $0.30/GB: the free plan expires after 30 days, is deleted 14 days later and has no backups
    plan: 0.1c-256mb
    diskSizeGB: 5
    region: virginia
    # Documenso needs 14+, Prisma 6 supports up to 18
    postgresMajorVersion: "17"
    databaseName: documenso
    user: documenso
    # Private network only; add your IP in the dashboard while you run pg_dump
    ipAllowList: []
